<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edilicio - Solicitudes</title>
<script src="/d/_assets/grid-sdk.js"></script>
<style>
  :root{
    --yellow:#FFE600;
    --dark:#333333;
    --gray:#666666;
    --light:#f5f5f5;
    --border:#e0e0e0;
    --white:#ffffff;
    --blue:#3483fa;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Proxima Nova','Helvetica Neue',Arial,sans-serif;
    background:var(--light);
    color:var(--dark);
    font-size:14px;
  }
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* Header */
  header{
    background:var(--yellow);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
  }
  header .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;}
  header .brand .logo{
    width:34px;height:34px;border-radius:50%;
    background:var(--dark);color:var(--yellow);
    display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  header .user-box{display:flex;align-items:center;gap:14px;font-size:13px;}
  header .user-box .email{font-weight:600;}
  header .role-tag{
    background:var(--dark);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;
  }
  .btn{
    border:none;border-radius:6px;padding:9px 16px;font-weight:600;font-size:13px;
    background:var(--dark);color:#fff;transition:opacity .15s;
  }
  .btn:hover{opacity:.85;}
  .btn.secondary{background:#fff;color:var(--dark);border:1px solid var(--border);}
  .btn.yellow{background:var(--yellow);color:var(--dark);}
  .btn.danger{background:#e53935;color:#fff;}
  .btn.small{padding:6px 10px;font-size:12px;}

  /* Login */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--yellow) 0%,#fff 100%);
  }
  .login-card{
    background:#fff;border-radius:14px;padding:36px;width:420px;max-width:92vw;
    box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center;
  }
  .login-card .logo{
    width:64px;height:64px;border-radius:50%;background:var(--yellow);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    font-size:30px;
  }
  .login-card h1{font-size:22px;margin-bottom:6px;}
  .login-card p{color:var(--gray);margin-bottom:22px;}
  .login-card label{display:block;text-align:left;font-weight:600;margin-bottom:6px;font-size:13px;}
  .role-choice{display:flex;gap:10px;margin:18px 0;}
  .role-choice .opt{
    flex:1;border:2px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;
    font-weight:600;transition:all .15s;
  }
  .role-choice .opt.active{border-color:var(--dark);background:var(--light);}
  .role-choice .opt small{display:block;font-weight:400;color:var(--gray);margin-top:4px;font-size:11px;}

  input,select,textarea{
    width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;
    font-family:inherit;background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  textarea{resize:vertical;min-height:70px;}

  /* App layout */
  #app{display:none;}
  .container{max-width:1300px;margin:0 auto;padding:24px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);}
  .tab{
    padding:11px 20px;font-weight:600;color:var(--gray);border:none;background:none;
    border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  .tab.active{color:var(--dark);border-bottom-color:var(--yellow);}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .toolbar select,.toolbar input{width:auto;min-width:140px;}
  .toolbar .spacer{flex:1;}

  /* Cards / table */
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .card{
    background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);
    border:1px solid var(--border);
  }
  .card .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card .card-id{font-size:11px;color:var(--gray);font-family:monospace;}
  .card h3{font-size:15px;margin-bottom:4px;}
  .card .meta{font-size:12px;color:var(--gray);line-height:1.7;}
  .card .meta b{color:var(--dark);font-weight:600;}
  .card .desc{margin:10px 0;font-size:13px;background:var(--light);padding:8px 10px;border-radius:6px;}
  .card .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .card img.thumb{max-width:100%;border-radius:6px;margin-top:8px;max-height:160px;object-fit:cover;}

  .badge{
    display:inline-block;padding:4px 11px;border-radius:14px;font-size:11px;font-weight:700;color:#fff;
    white-space:nowrap;
  }
  .badge.Pendiente{background:#fb8c00;}
  .badge.En.proceso,.badge.Enproceso{background:var(--blue);}
  .badge.Finalizada{background:#43a047;}
  .badge.Rechazada{background:#e53935;}
  .badge.DFinalizada{background:#43a047;}
  .badge.ECancelada{background:#9e9e9e;}
  .badge.Alta{background:#e53935;}
  .badge.Media{background:#fb8c00;}
  .badge.Baja{background:#43a047;}

  /* Form */
  .form-card{background:#fff;border-radius:12px;padding:24px;max-width:760px;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block;font-weight:600;margin-bottom:6px;font-size:13px;}
  .field{margin-bottom:4px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .img-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .img-preview img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}

  /* Spinner */
  .spinner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--gray);}
  .spinner{
    width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--dark);
    border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .empty{text-align:center;padding:50px;color:var(--gray);}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal{
    background:#fff;border-radius:14px;padding:24px;width:480px;max-width:94vw;max-height:90vh;overflow:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .modal h2{font-size:18px;margin-bottom:6px;}
  .modal p{color:var(--gray);margin-bottom:18px;}
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .modal .field{margin-bottom:14px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--dark);color:#fff;padding:12px 22px;border-radius:10px;z-index:1100;
    box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:600;font-size:13px;
  }

  @media(max-width:680px){
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">&#127959;</div>
    <h1>Edilicio - Solicitudes</h1>
    <p>Sistema de tickets de mantenimiento</p>
    <div class="field" style="margin-bottom:16px;">
      <label>Tu email</label>
      <input type="email" id="loginEmail" placeholder="nombre@mercadolibre.com">
    </div>
    <label>&iquest;Sos del equipo de mantenimiento?</label>
    <div class="role-choice">
      <div class="opt active" data-role="operativo" onclick="selectRole(this,'operativo')">
        No, soy operativo<small>Crear y ver mis solicitudes</small>
      </div>
      <div class="opt" data-role="mantenimiento" onclick="selectRole(this,'mantenimiento')">
        S&iacute;, mantenimiento<small>Gestionar todas las solicitudes</small>
      </div>
    </div>
    <button class="btn yellow" style="width:100%;margin-top:8px;" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="brand"><span class="logo">E</span><span>Edilicio - Solicitudes</span></div>
    <div class="user-box">
      <span class="email" id="hdrEmail"></span>
      <span class="role-tag" id="hdrRole"></span>
      <button class="btn small secondary" onclick="logout()">Salir</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs" id="tabs"></div>
    <div id="viewArea"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";

/* ===== Config ===== */
var SPREADSHEET_ID = '1RrTWra9E5xvJDWh2-owhz2yIuvqE9cDFa1r1YeY3lIY';
var SHEET = 'Solicitudes';
var RANGE = SHEET + '!A1:AE10000';
var APPEND_RANGE = SHEET + '!A:AE';

/* In-memory session (lives only in this variable) */
var session = { email: '', role: '' };

/* In-memory cache of rows */
var allRows = [];      // array of objects keyed by COLS
var headerRow = [];

var COLS = [
  'Id solicitud','Solicitante','Sector que pertenece','Area','Sector','Equipo',
  'Parte del equipo','Desvio/Solicitud','Ubicacion (Calle)',
  'Ubicacion (Dock/Puesto/Calle/Modulo)','Descripcion','Imagen (URL)','Video (URL)',
  'Estado','Turno responsable','Fecha Planificacion','FechaHora inicio real',
  'FechaHora fin real','Comentario Mantenimiento','Fecha Creacion solicitud',
  'Imagen 2','Imagen 3','Imagen Mantenimiento','Material Pendiente','Comentario de Rechazo',
  'Cantidad necesaria','Numero de carro','Zona de reparacion','Sites','Prioridad','Tipo reporte'
];

/* Dropdown data */
var OPTS = {
  Area:['FBM','FBA','Crossdocking','Flex'],
  Sector:['Almacenamiento (RK)','Recepcion','Despacho','Packing','Sorter'],
  Equipo:['Racks','Cintas de Seguridad','Parantes','Protecciones','Transpallets','Zorras','Escaleras'],
  Parte:['Parante / Viga','Protecciones','Base','Travesaño'],
  Desvio:['Dañadas','Desprendido','Roto','Faltante','Desgastado','Implementación'],
  Prioridad:['Alta','Media','Baja'],
  Turno:['T1A','T1B','T2A','T2B','T3A','T3B'],
  Sites:['ARBA01','ARBA02','ARBA03'],
  Estado:['Pendiente','En proceso','Finalizada','Rechazada','D-Finalizada','E-Cancelada']
};

/* ===== Utils ===== */
function $(id){return document.getElementById(id);}
function esc(s){
  s = (s==null)?'':String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function genId(){
  var h='0123456789abcdef',s='';
  for(var i=0;i<8;i++){ s += h.charAt(Math.floor(Math.random()*16)); }
  return s;
}
function nowStr(){
  var d=new Date();
  function p(n){return (n<10?'0':'')+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function badgeClass(v){ return (v||'').replace(/[\s-]/g,''); }

/* ===== Grid init ===== */
function initGrid(){
  try{
    var docId=(location.pathname.match(/\/d\/([^\/]+)/)||[])[1];
    Grid.configure({ docId: docId });
    console.log('[Grid] configured docId='+docId);
    console.log('[Grid] SDK='+typeof Grid+' sheets='+typeof Grid.sheets);
    Grid.sheets.get(SPREADSHEET_ID,'Solicitudes!A1:A1').then(function(r){
      console.log('[Grid] test read OK',r);
    }).catch(function(e){
      console.error('[Grid] test read FAILED',JSON.stringify(e));
    });
  }catch(e){
    console.error('[Grid] init error',e);
  }
}
function detectEmail(){
  try{
    if(Grid && Grid.session && Grid.session.email) return Grid.session.email;
    if(Grid && Grid.user && Grid.user.email) return Grid.user.email;
  }catch(e){}
  return '';
}

/* ===== Login ===== */
function selectRole(el,role){
  var opts=document.querySelectorAll('.role-choice .opt');
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('active');
  el.classList.add('active');
  el.setAttribute('data-selected','1');
  session._pendingRole = role;
}
function doLogin(){
  var email = $('loginEmail').value.trim();
  if(!email){ showAlert('Email requerido','Por favor ingresá tu email.'); return; }
  session.email = email;
  session.role = session._pendingRole || 'operativo';
  $('loginScreen').style.display='none';
  $('app').style.display='block';
  $('hdrEmail').textContent = session.email;
  $('hdrRole').textContent = session.role==='mantenimiento'?'Mantenimiento':'Operativo';
  buildTabs();
  loadData(true);
}
function logout(){
  session.email=''; session.role=''; allRows=[];
  $('app').style.display='none';
  $('loginScreen').style.display='flex';
}

/* ===== Tabs ===== */
var currentTab='';
function buildTabs(){
  var tabs=$('tabs'); tabs.innerHTML='';
  var defs;
  if(session.role==='mantenimiento'){
    defs=[['todas','Todas las Solicitudes']];
  }else{
    defs=[['mis','Mis Solicitudes'],['nueva','Nueva Solicitud']];
  }
  defs.forEach(function(d,i){
    var b=document.createElement('button');
    b.className='tab'+(i===0?' active':'');
    b.textContent=d[1];
    b.onclick=function(){ switchTab(d[0],b); };
    tabs.appendChild(b);
  });
  currentTab=defs[0][0];
}
function switchTab(t,btn){
  currentTab=t;
  var ts=document.querySelectorAll('.tab');
  for(var i=0;i<ts.length;i++) ts[i].classList.remove('active');
  btn.classList.add('active');
  render();
}

/* ===== Data load ===== */
function loadData(showSpin){
  if(showSpin) renderSpinner();
  Grid.sheets.get(SPREADSHEET_ID, RANGE).then(function(res){
    var values = (res && res.values) ? res.values : (Array.isArray(res)?res:[]);
    headerRow = values.length?values[0]:COLS.slice();
    allRows=[];
    for(var r=1;r<values.length;r++){
      var row=values[r];
      if(!row || (row.join('')==='')) continue;
      var obj={ _rowIndex: r+1 };
      for(var c=0;c<COLS.length;c++){ obj[COLS[c]] = row[c]!=null?row[c]:''; }
      allRows.push(obj);
    }
    render();
  }).catch(function(err){
    $('viewArea').innerHTML='<div class="empty">No se pudieron cargar las solicitudes.<br><small>'+esc(err&&err.message||err)+'</small></div>';
  });
}

/* ===== Render ===== */
function renderSpinner(){
  $('viewArea').innerHTML='<div class="spinner-wrap"><div class="spinner"></div>Cargando solicitudes...</div>';
}

var filters={ estado:'', area:'', site:'', prioridad:'', text:'' };

function render(){
  if(currentTab==='nueva'){ renderForm(); return; }
  renderList();
}

function renderList(){
  var rows = allRows.slice();
  if(currentTab==='mis'){
    rows = rows.filter(function(r){ return (r['Solicitante']||'').toLowerCase()===session.email.toLowerCase(); });
  }
  // apply filters
  if(filters.estado) rows=rows.filter(function(r){return r['Estado']===filters.estado;});
  if(filters.area) rows=rows.filter(function(r){return r['Area']===filters.area;});
  if(filters.site) rows=rows.filter(function(r){return r['Sites']===filters.site;});
  if(filters.prioridad) rows=rows.filter(function(r){return r['Prioridad']===filters.prioridad;});
  if(filters.text){
    var t=filters.text.toLowerCase();
    rows=rows.filter(function(r){
      return (r['Id solicitud']+' '+r['Descripcion']+' '+r['Solicitante']+' '+r['Equipo']).toLowerCase().indexOf(t)>=0;
    });
  }
  rows.reverse(); // newest first

  var html = toolbarHtml();
  if(!rows.length){
    html += '<div class="empty">No hay solicitudes para mostrar.</div>';
    $('viewArea').innerHTML=html;
    bindToolbar();
    return;
  }
  html += '<div class="grid-cards">';
  rows.forEach(function(r){ html += cardHtml(r); });
  html += '</div>';
  $('viewArea').innerHTML=html;
  bindToolbar();
}

function toolbarHtml(){
  function sel(id,label,arr,val){
    var o='<option value="">'+label+'</option>';
    arr.forEach(function(a){ o+='<option value="'+esc(a)+'"'+(val===a?' selected':'')+'>'+esc(a)+'</option>'; });
    return '<select id="'+id+'">'+o+'</select>';
  }
  return '<div class="toolbar">'
    + '<input type="text" id="fText" placeholder="Buscar..." value="'+esc(filters.text)+'">'
    + sel('fEstado','Estado',OPTS.Estado,filters.estado)
    + sel('fArea','Área',OPTS.Area,filters.area)
    + sel('fSite','Site',OPTS.Sites,filters.site)
    + sel('fPrio','Prioridad',OPTS.Prioridad,filters.prioridad)
    + '<button class="btn small secondary" onclick="clearFilters()">Limpiar</button>'
    + '<div class="spacer"></div>'
    + '<button class="btn small" onclick="loadData(true)">&#8635; Actualizar</button>'
    + '</div>';
}
function bindToolbar(){
  var ft=$('fText'); if(ft) ft.oninput=function(){filters.text=ft.value;renderListDebounced();};
  ['fEstado','fArea','fSite','fPrio'].forEach(function(id){
    var e=$(id); if(!e) return;
    e.onchange=function(){
      filters.estado=$('fEstado').value; filters.area=$('fArea').value;
      filters.site=$('fSite').value; filters.prioridad=$('fPrio').value;
      renderList();
    };
  });
}
var _deb;
function renderListDebounced(){ clearTimeout(_deb); _deb=setTimeout(renderList,250); }
function clearFilters(){ filters={estado:'',area:'',site:'',prioridad:'',text:''}; renderList(); }

function cardHtml(r){
  var img = r['Imagen (URL)']||'';
  var h='<div class="card">';
  h+='<div class="card-head">';
  h+='<div><div class="card-id">#'+esc(r['Id solicitud'])+'</div>';
  h+='<h3>'+esc(r['Equipo']||'Solicitud')+' &middot; '+esc(r['Desvio/Solicitud']||'')+'</h3></div>';
  h+='<span class="badge '+badgeClass(r['Estado'])+'">'+esc(r['Estado']||'-')+'</span>';
  h+='</div>';
  h+='<div class="meta">';
  h+='<div><b>Solicitante:</b> '+esc(r['Solicitante'])+'</div>';
  h+='<div><b>Área/Sector:</b> '+esc(r['Area'])+' / '+esc(r['Sector'])+'</div>';
  h+='<div><b>Parte:</b> '+esc(r['Parte del equipo']||'-')+'</div>';
  h+='<div><b>Ubicación:</b> '+esc(r['Ubicacion (Calle)']||'-')+' / '+esc(r['Ubicacion (Dock/Puesto/Calle/Modulo)']||'-')+'</div>';
  h+='<div><b>Site:</b> '+esc(r['Sites']||'-')+' &nbsp; <b>Prioridad:</b> ';
  h+= r['Prioridad']?('<span class="badge '+badgeClass(r['Prioridad'])+'">'+esc(r['Prioridad'])+'</span>'):'-';
  h+='</div>';
  h+='<div><b>Turno resp.:</b> '+esc(r['Turno responsable']||'-')+' &nbsp; <b>Planif.:</b> '+esc(r['Fecha Planificacion']||'-')+'</div>';
  h+='<div><b>Creada:</b> '+esc(r['Fecha Creacion solicitud']||'-')+'</div>';
  h+='</div>';
  if(r['Descripcion']) h+='<div class="desc">'+esc(r['Descripcion'])+'</div>';
  if(r['Comentario Mantenimiento']) h+='<div class="desc"><b>Mant.:</b> '+esc(r['Comentario Mantenimiento'])+'</div>';
  if(r['Comentario de Rechazo']) h+='<div class="desc" style="background:#ffebee;"><b>Rechazo:</b> '+esc(r['Comentario de Rechazo'])+'</div>';
  if(img && img.indexOf('data:')===0) h+='<img class="thumb" src="'+esc(img)+'" alt="img">';

  h+='<div class="actions">';
  if(session.role==='mantenimiento'){
    h+='<button class="btn small" onclick="openManage(\''+esc(r['Id solicitud'])+'\')">Gestionar</button>';
  }
  h+='</div>';
  h+='</div>';
  return h;
}

/* ===== Form (Nueva solicitud) ===== */
var formImages=[null,null,null]; // base64 for Imagen, Imagen2, Imagen3

function opt(arr,sel){
  var o='<option value="">Seleccionar...</option>';
  arr.forEach(function(a){o+='<option value="'+esc(a)+'"'+(sel===a?' selected':'')+'>'+esc(a)+'</option>';});
  return o;
}
function renderForm(){
  formImages=[null,null,null];
  var h='<div class="form-card"><h2 style="margin-bottom:18px;">Nueva Solicitud</h2><div class="form-grid">';
  h+=fld('Sector que pertenece','<input id="f_sectorpert" placeholder="Sector al que pertenece">');
  h+=fld('Área','<select id="f_area">'+opt(OPTS.Area)+'</select>');
  h+=fld('Sector','<select id="f_sector">'+opt(OPTS.Sector)+'</select>');
  h+=fld('Equipo','<select id="f_equipo">'+opt(OPTS.Equipo)+'</select>');
  h+=fld('Parte del equipo','<select id="f_parte">'+opt(OPTS.Parte)+'</select>');
  h+=fld('Desvío / Solicitud','<select id="f_desvio">'+opt(OPTS.Desvio)+'</select>');
  h+=fld('Prioridad','<select id="f_prio">'+opt(OPTS.Prioridad)+'</select>');
  h+=fld('Site','<select id="f_site">'+opt(OPTS.Sites)+'</select>');
  h+=fld('Ubicación (Calle)','<input id="f_calle">');
  h+=fld('Ubicación (Dock/Puesto/Calle/Módulo)','<input id="f_ubic">');
  h+=fld('Cantidad necesaria','<input id="f_cant" type="number" min="0">');
  h+=fld('Número de carro','<input id="f_carro">');
  h+=fld('Zona de reparación','<input id="f_zona">');
  h+=fld('Tipo reporte','<input id="f_tipo">');
  h+=fld('Video (URL)','<input id="f_video" placeholder="https://...">','full');
  h+=fld('Descripción','<textarea id="f_desc"></textarea>','full');
  h+=fld('Imágenes (hasta 3)','<input type="file" accept="image/*" multiple id="f_imgs" onchange="handleImgs(this)"><div class="img-preview" id="imgPrev"></div>','full');
  h+='</div>';
  h+='<div class="form-actions"><button class="btn secondary" onclick="render()">Cancelar</button><button class="btn yellow" onclick="submitForm()">Crear solicitud</button></div>';
  h+='</div>';
  $('viewArea').innerHTML=h;

  // cascading: area -> sector (kept simple, all options available but reset downstream on change)
  var fa=$('f_area'),fs=$('f_sector'),fe=$('f_equipo'),fp=$('f_parte');
  fa.onchange=function(){fs.value='';fe.value='';fp.value='';};
  fs.onchange=function(){fe.value='';fp.value='';};
  fe.onchange=function(){fp.value='';};
}
function fld(label,inner,full){
  return '<div class="field'+(full?' full':'')+'"><label>'+label+'</label>'+inner+'</div>';
}
function handleImgs(input){
  var files=input.files; formImages=[null,null,null];
  var prev=$('imgPrev'); prev.innerHTML='';
  var max=Math.min(files.length,3);
  for(var i=0;i<max;i++){
    (function(idx){
      var reader=new FileReader();
      reader.onload=function(e){
        formImages[idx]=e.target.result;
        var img=document.createElement('img'); img.src=e.target.result; prev.appendChild(img);
      };
      reader.readAsDataURL(files[idx]);
    })(i);
  }
}
function val(id){ var e=$(id); return e?e.value.trim():''; }
function submitForm(){
  if(!val('f_area')||!val('f_sector')||!val('f_equipo')){
    showAlert('Campos requeridos','Completá al menos Área, Sector y Equipo.'); return;
  }
  var id=genId();
  // Build row in COLS order
  var data={};
  data['Id solicitud']=id;
  data['Solicitante']=session.email;
  data['Sector que pertenece']=val('f_sectorpert');
  data['Area']=val('f_area');
  data['Sector']=val('f_sector');
  data['Equipo']=val('f_equipo');
  data['Parte del equipo']=val('f_parte');
  data['Desvio/Solicitud']=val('f_desvio');
  data['Ubicacion (Calle)']=val('f_calle');
  data['Ubicacion (Dock/Puesto/Calle/Modulo)']=val('f_ubic');
  data['Descripcion']=val('f_desc');
  data['Imagen (URL)']=formImages[0]||'';
  data['Video (URL)']=val('f_video');
  data['Estado']='Pendiente';
  data['Turno responsable']='';
  data['Fecha Planificacion']='';
  data['FechaHora inicio real']='';
  data['FechaHora fin real']='';
  data['Comentario Mantenimiento']='';
  data['Fecha Creacion solicitud']=nowStr();
  data['Imagen 2']=formImages[1]||'';
  data['Imagen 3']=formImages[2]||'';
  data['Imagen Mantenimiento']='';
  data['Material Pendiente']='';
  data['Comentario de Rechazo']='';
  data['Cantidad necesaria']=val('f_cant');
  data['Numero de carro']=val('f_carro');
  data['Zona de reparacion']=val('f_zona');
  data['Sites']=val('f_site');
  data['Prioridad']=val('f_prio');
  data['Tipo reporte']=val('f_tipo');

  var rowArr=COLS.map(function(c){return data[c]!=null?data[c]:'';});

  var overlay=showSpinnerModal('Guardando solicitud...');
  fetch('https://api.mercadolibre.com/workspace/genai/verdi-flows/webhook/a7376f15-cdb8-46c6-997b-e8d2246d724b/external',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':'edilicio2024'},
    body:JSON.stringify(data)
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    closeModal();
    toast('Solicitud #'+id+' creada');
    if(session.role!=='mantenimiento'){
      var tabBtns=document.querySelectorAll('.tab');
      switchTab('mis',tabBtns[0]);
    }
  }).catch(function(err){
    closeModal();
    showAlert('Error','No se pudo guardar la solicitud: '+esc(err&&err.message||String(err)));
  });
}

/* ===== Manage (Mantenimiento) ===== */
function openManage(id){
  var r=findRow(id);
  if(!r){ showAlert('No encontrada','La solicitud no existe.'); return; }
  var h='<div class="modal"><h2>Gestionar #'+esc(id)+'</h2><p>'+esc(r['Equipo'])+' &middot; '+esc(r['Desvio/Solicitud'])+'</p>';
  h+='<div class="field"><label>Estado</label><select id="m_estado">'+opt(OPTS.Estado,r['Estado'])+'</select></div>';
  h+='<div class="field"><label>Turno responsable</label><select id="m_turno">'+opt(OPTS.Turno,r['Turno responsable'])+'</select></div>';
  h+='<div class="field"><label>Fecha Planificación</label><input id="m_fplan" type="date" value="'+esc(r['Fecha Planificacion'])+'"></div>';
  h+='<div class="field"><label>FechaHora inicio real</label><input id="m_ini" value="'+esc(r['FechaHora inicio real'])+'" placeholder="YYYY-MM-DD HH:MM"></div>';
  h+='<div class="field"><label>FechaHora fin real</label><input id="m_fin" value="'+esc(r['FechaHora fin real'])+'" placeholder="YYYY-MM-DD HH:MM"></div>';
  h+='<div class="field"><label>Comentario Mantenimiento</label><textarea id="m_com">'+esc(r['Comentario Mantenimiento'])+'</textarea></div>';
  h+='<div class="field"><label>Material Pendiente</label><input id="m_mat" value="'+esc(r['Material Pendiente'])+'"></div>';
  h+='<div class="field"><label>Comentario de Rechazo (si rechazás)</label><textarea id="m_rech">'+esc(r['Comentario de Rechazo'])+'</textarea></div>';
  h+='<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cerrar</button>';
  h+='<button class="btn danger" onclick="rejectReq(\''+esc(id)+'\')">Rechazar</button>';
  h+='<button class="btn yellow" onclick="saveManage(\''+esc(id)+'\')">Guardar</button></div>';
  h+='</div>';
  openModal(h);
}
function rejectReq(id){
  var rech=val('m_rech');
  if(!rech){ showAlert('Motivo requerido','Ingresá el Comentario de Rechazo para rechazar.'); return; }
  $('m_estado').value='Rechazada';
  saveManage(id);
}
function saveManage(id){
  var r=findRow(id);
  if(!r) return;
  var estado=$('m_estado').value;
  r['Estado']=estado;
  r['Turno responsable']=$('m_turno').value;
  r['Fecha Planificacion']=$('m_fplan').value;
  r['FechaHora inicio real']=val('m_ini');
  r['FechaHora fin real']=val('m_fin');
  r['Comentario Mantenimiento']=val('m_com');
  r['Material Pendiente']=val('m_mat');
  r['Comentario de Rechazo']=val('m_rech');
  if(estado==='En proceso' && !r['FechaHora inicio real']) r['FechaHora inicio real']=nowStr();
  if((estado==='Finalizada'||estado==='D-Finalizada') && !r['FechaHora fin real']) r['FechaHora fin real']=nowStr();

  var rowArr=COLS.map(function(c){return r[c]!=null?r[c]:'';});
  var cellRange = SHEET+'!A'+r._rowIndex+':AE'+r._rowIndex;
  closeModal();
  var ov=showSpinnerModal('Guardando cambios...');
  Grid.sheets.set(SPREADSHEET_ID, cellRange, [rowArr]).then(function(){
    closeModal();
    toast('Solicitud #'+id+' actualizada');
    render();
  }).catch(function(err){
    closeModal();
    showAlert('Error','No se pudo guardar: '+esc(err&&err.message||err));
  });
}
function findRow(id){
  for(var i=0;i<allRows.length;i++){ if(allRows[i]['Id solicitud']===id) return allRows[i]; }
  return null;
}

/* ===== Modals / Toast ===== */
function openModal(html){
  var root=$('modalRoot');
  root.innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+html+'</div>';
}
function closeModal(){ $('modalRoot').innerHTML=''; }
function showAlert(title,msg){
  openModal('<div class="modal"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><div class="modal-actions"><button class="btn yellow" onclick="closeModal()">Entendido</button></div></div>');
}
function showSpinnerModal(msg){
  $('modalRoot').innerHTML='<div class="modal-overlay"><div class="modal" style="text-align:center;"><div class="spinner" style="margin:10px auto 16px;"></div>'+esc(msg)+'</div></div>';
}
var _toastT;
function toast(msg){
  $('toastRoot').innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){ $('toastRoot').innerHTML=''; },3000);
}

/* ===== Boot ===== */
(function(){
  initGrid();
  var em=detectEmail();
  if(em){ $('loginEmail').value=em; }
})();
</script>
