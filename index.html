<style>
  :root{
    --yellow:#FFE600;
    --dark:#333333;
    --gray:#666666;
    --light:#f5f5f5;
    --border:#e0e0e0;
    --white:#ffffff;
    --blue:#3483fa;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Proxima Nova','Helvetica Neue',Arial,sans-serif;
    background:var(--light);
    color:var(--dark);
    font-size:14px;
  }
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* Header */
  header{
    background:var(--yellow);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
  }
  header .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;}
  header .brand .logo{
    width:34px;height:34px;border-radius:50%;
    background:var(--dark);color:var(--yellow);
    display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  header .user-box{display:flex;align-items:center;gap:14px;font-size:13px;}
  header .user-box .email{font-weight:600;}
  header .role-tag{
    background:var(--dark);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;
  }
  .btn{
    border:none;border-radius:6px;padding:9px 16px;font-weight:600;font-size:13px;
    background:var(--dark);color:#fff;transition:opacity .15s;
  }
  .btn:hover{opacity:.85;}
  .btn.secondary{background:#fff;color:var(--dark);border:1px solid var(--border);}
  .btn.yellow{background:var(--yellow);color:var(--dark);}
  .btn.danger{background:#e53935;color:#fff;}
  .btn.small{padding:6px 10px;font-size:12px;}

  /* Login */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--yellow) 0%,#fff 100%);
  }
  .login-card{
    background:#fff;border-radius:14px;padding:36px;width:420px;max-width:92vw;
    box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center;
  }
  .login-card .logo{
    width:64px;height:64px;border-radius:50%;background:var(--yellow);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    font-size:30px;
  }
  .login-card h1{font-size:22px;margin-bottom:6px;}
  .login-card p{color:var(--gray);margin-bottom:22px;}
  .login-card label{display:block;text-align:left;font-weight:600;margin-bottom:6px;font-size:13px;}
  .role-choice{display:flex;gap:10px;margin:18px 0;}
  .role-choice .opt{
    flex:1;border:2px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;
    font-weight:600;transition:all .15s;
  }
  .role-choice .opt.active{border-color:var(--dark);background:var(--light);}
  .role-choice .opt small{display:block;font-weight:400;color:var(--gray);margin-top:4px;font-size:11px;}

  input,select,textarea{
    width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;
    font-family:inherit;background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  textarea{resize:vertical;min-height:70px;}

  /* App layout */
  #app{display:none;}
  .container{max-width:1300px;margin:0 auto;padding:24px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);}
  .tab{
    padding:11px 20px;font-weight:600;color:var(--gray);border:none;background:none;
    border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  .tab.active{color:var(--dark);border-bottom-color:var(--yellow);}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .toolbar select,.toolbar input{width:auto;min-width:140px;}
  .toolbar .spacer{flex:1;}

  /* Cards / table */
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .group-header{font-size:15px;font-weight:700;padding:10px 12px;margin-top:12px;background:var(--dark);color:#fff;border-radius:6px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .group-header:hover{opacity:.9;}
  .group-count{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;font-size:12px;margin-left:auto;}
  .group-arrow{font-size:11px;width:14px;flex-shrink:0;}
  .estado-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .estado-dotPendiente{background:#e53935;}
  .estado-dotEnproceso{background:#FFE600;}
  .estado-dotFinalizada,.estado-dotDFinalizada{background:#43a047;}
  .estado-dotRechazada,.estado-dotECancelada{background:#9e9e9e;}
  .group-body.hidden{display:none;}
  .group-subheader{font-size:13px;font-weight:600;color:var(--dark);padding:8px 12px;background:#f5f5f5;border-left:4px solid var(--yellow);margin-top:2px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .group-subheader:hover{background:#eee;}
  .group-subheader .group-count{background:var(--dark);color:#fff;margin-left:auto;}
  .list-table{border:1px solid var(--border);border-top:none;}
  .list-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
  .list-row:hover{background:#fafafa;}
  .list-row:last-child{border-bottom:none;}
  .list-id{font-size:11px;color:var(--gray);font-family:monospace;width:80px;flex-shrink:0;}
  .list-main{flex:1;min-width:0;}
  .list-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .list-sub{font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .list-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .list-date{font-size:11px;color:var(--gray);}
  .card{
    background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);
    border:1px solid var(--border);
  }
  .card .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card .card-id{font-size:11px;color:var(--gray);font-family:monospace;}
  .card h3{font-size:15px;margin-bottom:4px;}
  .card .meta{font-size:12px;color:var(--gray);line-height:1.7;}
  .card .meta b{color:var(--dark);font-weight:600;}
  .card .desc{margin:10px 0;font-size:13px;background:var(--light);padding:8px 10px;border-radius:6px;}
  .card .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .card img.thumb{max-width:100%;border-radius:6px;margin-top:8px;max-height:160px;object-fit:cover;}

  .badge{
    display:inline-block;padding:4px 11px;border-radius:14px;font-size:11px;font-weight:700;color:#fff;
    white-space:nowrap;
  }
  .badge.Pendiente{background:#fb8c00;}
  .badge.En.proceso,.badge.Enproceso{background:var(--blue);}
  .badge.Finalizada{background:#43a047;}
  .badge.Rechazada{background:#e53935;}
  .badge.DFinalizada{background:#43a047;}
  .badge.ECancelada{background:#9e9e9e;}
  .badge.Alta{background:#e53935;}
  .badge.Media{background:#fb8c00;}
  .badge.Baja{background:#43a047;}

  /* Form */
  .form-card{background:#fff;border-radius:12px;padding:24px;max-width:760px;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block;font-weight:600;margin-bottom:6px;font-size:13px;}
  .field{margin-bottom:4px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .img-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .img-preview img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}

  /* Spinner */
  .spinner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--gray);}
  .spinner{
    width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--dark);
    border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .empty{text-align:center;padding:50px;color:var(--gray);}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal{
    background:#fff;border-radius:14px;padding:24px;width:480px;max-width:94vw;max-height:90vh;overflow:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .modal h2{font-size:18px;margin-bottom:6px;}
  .modal p{color:var(--gray);margin-bottom:18px;}
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .modal .field{margin-bottom:14px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--dark);color:#fff;padding:12px 22px;border-radius:10px;z-index:1100;
    box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:600;font-size:13px;
  }

  @media(max-width:680px){
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>

function resolveRole(email){
  var u = MAINT_USERS[(email||'').toLowerCase()];
  return u ? u : null;
}

function canDo(action){
  var r = session.role;
  switch(action){
    case 'crear':         return r==='operativo'||r==='planner'||r==='admin';
    case 'verTodas':      return r!=='operativo';
    case 'asignarTurno':  return r==='tl'||r==='planner'||r==='admin';
    case 'cambiarEstado': return r==='admin'||r==='tl'||r==='planner';
    case 'comentMant':    return r==='tecnico'||r==='tl'||r==='planner'||r==='admin';
    case 'fechas':        return r==='tecnico'||r==='planner'||r==='admin';
    case 'planificacion': return r==='planner';
    case 'rechazo':       return r==='planner'||r==='admin';
    case 'material':      return r==='tecnico'||r==='planner'||r==='admin';
    default: return false;
  }
}

function roleLabel(r){
  return {planner:'Planner',tl:'TL',tecnico:'Técnico',admin:'Admin',operativo:'Operativo'}[r]||r;
}

function $(id){return document.getElementById(id);}
function esc(s){
  s = (s==null)?'':String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function genId(){
  var h='0123456789abcdef',s='';
  for(var i=0;i<8;i++){ s += h.charAt(Math.floor(Math.random()*16)); }
  return s;
}
function nowStr(){
  var d=new Date();
  function p(n){return (n<10?'0':'')+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* ===== Login ===== */
function saveEmail(email){
  try{ localStorage.setItem('edilicio_email', email); }catch(e){}
  gsSet('email', email);
}
function loadEmail(){
  try{
    var e = localStorage.getItem('edilicio_email');
    if(e) return e;
  }catch(e2){}
  return '';
}
function clearEmail(){
  try{ localStorage.removeItem('edilicio_email'); }catch(e){}
  gsSet('email','');
}
function startSession(email){
  email = (email||'').toLowerCase().trim();
  if(!email) return false;
  var userData = resolveRole(email);
  session.email = email;
  session.role  = userData ? userData.permiso : 'operativo';
  session.turno = userData ? userData.turno   : '';
  session.site  = userData ? userData.site    : '';
  saveEmail(email);
  $('loginScreen').style.display='none';
  $('app').style.display='block';
  $('hdrEmail').textContent = session.email;
  $('hdrRole').textContent  = roleLabel(session.role);
  buildTabs();
  loadData(true);
  return true;
}
function doLoginManual(){
  var email = $('loginEmail') ? $('loginEmail').value.trim() : '';
  if(!email){ showAlert('Email requerido','Por favor ingresá tu email corporativo.'); return; }
  startSession(email);
}
function showLoginFallback(msg){
  $('loginStatus').textContent = msg||'Ingresá tu email para continuar.';
  $('loginFallback').style.display='block';
}
function logout(){
  clearEmail();
  session.email=''; session.role=''; session.turno=''; session.site=''; allRows=[];
  $('app').style.display='none';
  $('loginScreen').style.display='flex';
  $('loginFallback').style.display='none';
  $('loginStatus').textContent='';
  showLoginFallback('Ingresá tu email para continuar.');
}

function gsGet(key){
  // GRID.state.get(key) returns Promise resolving to {doc_id, state:{...}, updated_at}
  try{
    var s=window.GRID&&window.GRID.state;
    if(!s) return Promise.resolve(undefined);
    return s.get(key).then(function(v){
      return (v && v.state && v.state[key] !== undefined) ? v.state[key] : undefined;
    });
  }catch(e){ return Promise.resolve(undefined); }
}
function gsSet(key,val){
  // GRID.state.patch({key:val}) is the correct write method
  try{
    var s=window.GRID&&window.GRID.state;
    if(!s) return;
    var obj={}; obj[key]=val;
    s.patch(obj)
      .then(function(){ console.log('[gsSet] saved key='+key); })
      .catch(function(e){ console.warn('[gsSet] error key='+key, e); });
  }catch(e){ console.warn('[gsSet] exception', e); }
}

function loadData(showSpin){
  if(showSpin) renderSpinner();
  try{
    Grid.sheets.get(SPREADSHEET_ID, RANGE).then(function(result){
      console.log('[loadData] Grid.sheets OK');
      var rows = result && result.values;
      if(!rows || rows.length < 2){ allRows=[]; render(); return; }
      var headers = rows[0];
      var normHeaders = headers.map(function(h){ return (h||'').trim(); });
      allRows = rows.slice(1).reduce(function(acc,r,idx){
        if(!r || !r.some(function(c){ return c&&String(c).trim(); })) return acc;
        var obj={};
        normHeaders.forEach(function(h,i){ obj[h]=r[i]!=null?String(r[i]):''; });
        obj._rowIndex=idx+2;
        acc.push(obj);
        return acc;
      },[]);
      console.log('[loadData] headers='+JSON.stringify(normHeaders.slice(0,5)));
      console.log('[loadData] rows='+allRows.length);
      render();
    }).catch(function(e){
      console.warn('[loadData] Grid.sheets failed:', JSON.stringify(e));
      loadFromLocalStorage();
    });
  }catch(e){
    console.warn('[loadData] exception:', e);
    loadFromLocalStorage();
  }
}

  try{

  }
  // apply filters
  if(filters.estado) rows=rows.filter(function(r){return r['Estado']===filters.estado;});
  if(filters.area) rows=rows.filter(function(r){return r['Area']===filters.area;});
  if(filters.site) rows=rows.filter(function(r){return r['Sites']===filters.site;});
  if(filters.prioridad) rows=rows.filter(function(r){return r['Prioridad']===filters.prioridad;});
  if(filters.text){
    var t=filters.text.toLowerCase();
    rows=rows.filter(function(r){
      return (r['Id solicitud']+' '+r['Descripcion']+' '+r['Solicitante']+' '+r['Equipo']).toLowerCase().indexOf(t)>=0;
    });
  }
  rows.reverse(); // newest first

  if(currentTab==='todas'){

      var e = r['Estado']||'Sin estado';
      var t = r['Turno responsable']||'NN';
      if(!byEstado[e]) byEstado[e]={};
      if(!byEstado[e][t]) byEstado[e][t]=[];
      byEstado[e][t].push(r);
    });
    var estados = estadoOrder.filter(function(e){ return byEstado[e]; });
    Object.keys(byEstado).forEach(function(e){ if(estados.indexOf(e)<0) estados.push(e); });

    estados.forEach(function(e, ei){

    h+='<div class="field"><label>Comentario de Rechazo</label><textarea id="m_rech">'+esc(r['Comentario de Rechazo'])+'</textarea></div>';
  else if(r['Comentario de Rechazo'])
    h+='<div style="background:#ffebee;border-radius:6px;padding:10px;margin-bottom:10px;font-size:13px;"><b>Rechazo:</b> '+esc(r['Comentario de Rechazo'])+'</div>';

  h+='<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cerrar</button>';
  if(canDo('rechazo'))
    h+='<button class="btn danger" onclick="rejectReq(\''+esc(id)+'\')">Rechazar</button>';
  var canSave=canDo('cambiarEstado')||canDo('asignarTurno')||canDo('planificacion')||canDo('fechas')||canDo('comentMant')||canDo('material')||canDo('rechazo');
  if(canSave)
    h+='<button class="btn yellow" onclick="saveManage(\''+esc(id)+'\')">Guardar</button>';
  h+='</div></div>';
  openModal(h);
}
function rejectReq(id){
  var rech=val('m_rech');
  if(!rech){ showAlert('Motivo requerido','Ingresá el Comentario de Rechazo para rechazar.'); return; }
  $('m_estado').value='Rechazada';
  saveManage(id);
}
function saveManage(id){
  var r=findRow(id)||findRowByIndex(parseInt(id,10));
  if(!r) return;
  var estado = canDo('cambiarEstado') && $('m_estado') ? $('m_estado').value : r['Estado'];
  r['Estado']=estado;
  if(canDo('asignarTurno') && $('m_turno'))   r['Turno responsable']=$('m_turno').value;
  if(canDo('planificacion') && $('m_fplan'))  r['Fecha Planificacion']=$('m_fplan').value;
  if(canDo('fechas')){
    if($('m_ini')) r['FechaHora inicio real']=val('m_ini');
    if($('m_fin')) r['FechaHora fin real']=val('m_fin');
  }
  if(canDo('comentMant') && $('m_com'))  r['Comentario Mantenimiento']=val('m_com');
  if(canDo('material') && $('m_mat'))    r['Material Pendiente']=val('m_mat');
  if(canDo('rechazo') && $('m_rech'))    r['Comentario de Rechazo']=val('m_rech');
  if(estado==='En proceso' && !r['FechaHora inicio real']) r['FechaHora inicio real']=nowStr();
  if((estado==='Finalizada'||estado==='D-Finalizada') && !r['FechaHora fin real']) r['FechaHora fin real']=nowStr();

  var rowArr=COLS.map(function(c){return r[c]!=null?r[c]:'';});
  var cellRange = SHEET+'!A'+r._rowIndex+':AE'+r._rowIndex;
  closeModal();
  var ov=showSpinnerModal('Guardando cambios...');
  Grid.sheets.set(SPREADSHEET_ID, cellRange, [rowArr]).then(function(){
    closeModal();
    toast('Solicitud #'+id+' actualizada');
    render();
  }).catch(function(err){
    closeModal();
    showAlert('Error','No se pudo guardar: '+esc(err&&err.message||err));
  });
}
function findRow(id){
  for(var i=0;i<allRows.length;i++){ if(allRows[i]['Id solicitud']===id) return allRows[i]; }
  return null;
}
function findRowByIndex(rowIndex){
  for(var i=0;i<allRows.length;i++){ if(allRows[i]._rowIndex===rowIndex) return allRows[i]; }
  return null;
}
function openManageByIndex(rowIndex){
  var r=findRowByIndex(rowIndex);
  if(!r){ showAlert('No encontrada','La solicitud no existe.'); return; }
  openManageRow(r);
}

/* ===== Modals / Toast ===== */
function openModal(html){
  var root=$('modalRoot');
  root.innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+html+'</div>';
}
function closeModal(){ $('modalRoot').innerHTML=''; }
function showAlert(title,msg){
  openModal('<div class="modal"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><div class="modal-actions"><button class="btn yellow" onclick="closeModal()">Entendido</button></div></div>');
}
function showSpinnerModal(msg){
  $('modalRoot').innerHTML='<div class="modal-overlay"><div class="modal" style="text-align:center;"><div class="spinner" style="margin:10px auto 16px;"></div>'+esc(msg)+'</div></div>';
}
var _toastT;
function toast(msg){
  $('toastRoot').innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){ $('toastRoot').innerHTML=''; },3000);
}

/* ===== Boot ===== */
(function(){
  initGrid();
  var saved = loadEmail();
  if(saved){ startSession(saved); return; }
  showLoginFallback('Ingresá tu email para continuar.');
})();

</script>
